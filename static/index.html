<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0919" />
    <title>Universidad María Auxiliadora</title>
    <link rel="icon" href="logo.png" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Starfield in the back -->
    <canvas id="starsCanvas" aria-hidden="true"></canvas>

    <!-- Top brand bar (always visible) -->
    <header class="brand-bar" role="banner">
      <div class="brand">
        <img src="logo.png" alt="UMA" class="brand-logo" />
        <div class="brand-text">
          <h1 class="brand-title">Universidad María Auxiliadora</h1>
          <p class="brand-sub">Asistente virtual</p>
        </div>
      </div>
    </header>

    <!-- Chat area fills the rest of the screen -->
    <main class="chat-wrapper" role="main">
      <div class="chatbot-popup" role="region" aria-label="Chatbot UMA">
        <canvas id="chatbotStarsCanvas" aria-hidden="true"></canvas>

        <!-- you can add buttons to the header later if needed -->
        <div class="chat-header"></div>

        <!-- Messages scroll here -->
        <div class="chat-body" id="chatBody" aria-live="polite">
          <div class="bot-message-container first-message">
            <div class="logo-container">
              <img src="girltalk.gif" alt="Bot" class="bot-gif" id="initial-bot-gif"/>
            </div>
            <div class="bot-message-card">
              <div class="message-text">
                Hola friend 👋<br/>
                Bienvenidos al Chatbot de la Universidad María Auxiliadora ☺️
              </div>
            </div>
          </div>
        </div>

        <!-- Footer pinned at the bottom of the panel -->
        <div class="chat-footer">
          <form action="#" class="chat-form" id="chatForm" autocomplete="off">
            <div class="input-wrap">
              <textarea class="message-input" placeholder="Escribe aquí..." rows="1" required></textarea>
              <!-- Mic (inline SVG: no webfont dependency) -->
              <button type="button" id="record-voice" class="mic-btn" aria-label="Hablar">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21H9v2h6v-2h-2v-2.08A7 7 0 0 0 19 12h-2z"/>
                </svg>
              </button>
            </div>

            <!-- Send (inline SVG) -->
            <button type="submit" id="send-message" class="send-fab" aria-label="Enviar">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3.4 20.6 22 12 3.4 3.4 3 10l11 2-11 2z"/>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </main>

    <!-- Phone / WhatsApp chooser (unchanged) -->
    <div class="phone-overlay" id="phoneOverlay" onclick="closePhoneOptions()"></div>
    <div class="phone-options" id="phoneOptions" style="display:none;">
      <p>📲 ¿Cómo deseas contactar?</p>
      <button class="call-button" id="callButton">
        <img src="https://static.vecteezy.com/system/resources/previews/015/730/539/original/eps10-red-phone-call-or-telephone-abstract-icon-isolated-on-white-background-contact-us-or-hotline-symbol-in-a-simple-flat-trendy-modern-style-for-your-website-design-logo-and-mobile-app-vector.jpg" alt="Phone Icon"> Llamar
      </button>
      <button class="whatsapp-button" id="whatsappButton">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp Icon"> WhatsApp
      </button>
      <button class="close-button" onclick="closePhoneOptions()">❌ Cancelar</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
